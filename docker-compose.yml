services:
  # 1. Aplikasi Laravel (PHP)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kbkuu-app
    restart: always
    volumes:
      - .:/var/www
    environment:
      - DB_HOST=db
      - DB_DATABASE=kbkuu
      - DB_USERNAME=dev.hikarva.my.id
      - DB_PASSWORD=yaya123
    networks:
      - kbkuu-net

  # 2. Database
  db:
    image: mysql:8.0
    container_name: kbkuu-db
    restart: always
    environment:
      MYSQL_DATABASE: kbkuu
      MYSQL_USER: dev.hikarva.my.id
      MYSQL_PASSWORD: yaya123
      MYSQL_ROOT_PASSWORD: rootpassword
    networks:
      - kbkuu-net

  # 3. Web Server (Nginx)
  nginx:
    image: nginx:alpine
    container_name: kbkuu-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - kbkuu-net

  # 4. VS Code di Browser
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
      - PASSWORD=GantiPasswordDisini123 # GANTI PASSWORD INI
    volumes:
      - .:/config/workspace
    networks:
      - kbkuu-net

networks:
  kbkuu-net:
    driver: bridge
